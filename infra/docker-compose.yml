# Local stack. Step 2 brings up the database only; services are added as they are built.
# Usage (from the repo root):  docker compose -f infra/docker-compose.yml up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sahyog
      POSTGRES_PASSWORD: sahyog_local_only   # local dev only; never a real secret (house rule: no secrets in repo)
      POSTGRES_DB: sahyog
    ports:
      # Host port is configurable: DB_PORT=56000 docker compose ... up -d db
      # Default 55432 avoids clashing with a native Postgres (5432) or other local services.
      - "${DB_PORT:-55432}:5432"
    volumes:
      - ./db/000_extensions.sql:/docker-entrypoint-initdb.d/000_extensions.sql:ro
      - ./db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
      - ..:/repo:ro          # lets 002_load_generated.sql \copy the CSVs from inside the container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahyog -d sahyog"]
      interval: 5s
      retries: 10
  migrate:
    profiles: ["app"]
    image: sahyog-api:local
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: ["python", "tools/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sahyog:sahyog_local_only@db:5432/sahyog
      PYTHON_DOTENV_DISABLED: "1"
    volumes:
      - hfcache:/root/.cache/huggingface
  worker:
    image: sahyog-api:local
    profiles: ["app"]
    command: ["python", "-m", "services.records.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://sahyog:sahyog_local_only@db:5432/sahyog
      PYTHON_DOTENV_DISABLED: "1"
    volumes:
      - hfcache:/root/.cache/huggingface
      - uploads:/app/data/uploads
  api:
    image: sahyog-api:local
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://sahyog:sahyog_local_only@db:5432/sahyog
      SAHYOG_DEMO_AUTH: "1"
      W3_STOCK_DIR: /app/data/synthetic/out/w3/stock
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - hfcache:/root/.cache/huggingface
      - ../data/synthetic/out/w3/stock:/app/data/synthetic/out/w3/stock:ro
      - uploads:/app/data/uploads
volumes:
  pgdata:
  hfcache:
  uploads:
