<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sahyog operations</title>
  <link rel="stylesheet" href="/static/sahyog.css">
</head>
<body>
<header class="site-header"><div class="inner"><div class="brand">Sahyog Care Companion <span class="demo-badge">Demo · synthetic data</span></div>
<nav class="site-nav" aria-label="Main"><a href="/">Patient</a><a href="/frontdesk">Front desk</a><a href="/scribe">Doctor</a><a href="/ops" aria-current="page">Ops</a></nav></div></header>
<div class="page">
  <h1>Operations</h1>
  <div class="persona-bar"><span class="label">Sign in as</span><div class="persona-list" id="persona-list"></div>
  <details><summary>Other identity</summary>
  <form id="ops-auth-form" class="other-row">
    <label for="ops-id">Signed in as
    <input id="ops-id" required autocomplete="username"></label>
    <button>Load sourced metrics</button>
  </form></details></div>
  <p id="tiles-note" class="muted" role="status"></p>
  <section class="tiles" id="tiles" aria-live="polite"></section>
  <section class="card" id="load-table-card" style="margin-top:16px" hidden>
    <h2>Latest load test</h2>
    <p class="muted" id="load-summary"></p>
    <div class="table-wrap"><table id="load-table"><thead><tr><th>Endpoint</th><th>p95</th><th>Target</th><th>Requests</th><th>RPS</th><th>Result</th><th>Status codes</th><th>First error body (redacted)</th></tr></thead><tbody></tbody></table></div>
  </section>
  <section class="card" style="margin-top:16px">
  <h2>Trace lookup</h2>
  <form id="trace-form" class="other-row">
    <label for="trace-id">Trace ID
    <input id="trace-id" required autocomplete="off"></label>
    <button>View trace</button>
  </form>
  <div id="trace" class="trace" aria-live="polite" hidden></div>
  </section>
</div>
  <script>
    const tiles = document.getElementById("tiles");
    const traceOutput = document.getElementById("trace");
    const opsInput = document.getElementById("ops-id");
    const tokenKey = "sahyogOpsToken";
    const tokenPrefix = "demo-" + "ops-";
    const savedToken = sessionStorage.getItem(tokenKey) || "";
    opsInput.value = savedToken.startsWith(tokenPrefix) ? savedToken.slice(tokenPrefix.length) : "";

    function headers() {
      return { Authorization: `Bearer ${sessionStorage.getItem(tokenKey) || ""}` };
    }

    function numberText(value, digits = 1) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(digits).replace(/\.0$/, "") : String(value);
    }

    function percentText(value) {
      const percent = Number(value) * 100;
      return Number.isFinite(percent) ? `${numberText(percent)}%` : String(value);
    }

    function formatTile(tile) {
      const value = tile.value;
      const formatted = { text: String(value), status: "", detail: "" };
      if (tile.id === "breaker-state") {
        const open = Number(value.open) || 0;
        const halfOpen = Number(value.half_open) || 0;
        formatted.text = open === 0 && halfOpen === 0
          ? "All closed" : `${open} open · ${halfOpen} half-open`;
        formatted.status = open > 0 ? "bad" : "good";
      } else if (tile.id === "model-mode") {
        formatted.text = String(value);
      } else if (tile.id === "latest-load-test") {
        formatted.text = `${value.status} · ${value.requests} requests · `
          + `${numberText(value.requests_per_second, 4)} RPS`;
        formatted.detail = `Run ${value.run_id} · errors ${percentText(value.error_rate)} · `
          + `429 ${percentText(value.rate_429)} · `
          + `status ${JSON.stringify(value.status_codes || {})} · `
          + `${value.replicas.observed}/${value.replicas.configured} replicas `
          + `(${(value.replicas.ids || []).join(", ")})`;
        formatted.status = value.status === "PASS" ? "good" : "bad";
      } else if (tile.id.startsWith("load-endpoint-")) {
        formatted.text = `p95 ${numberText(value.p95_ms)} ms · target < `
          + `${numberText(value.target_ms)} ms · ${value.pass ? "PASS" : "FAIL"}`;
        formatted.detail = `Run ${value.run_id} · n = ${value.count} · `
          + `${numberText(value.rps, 4)} RPS`;
        formatted.status = value.pass ? "good" : "bad";
      } else if (tile.id.startsWith("load-") && tile.id.endsWith("-p95")) {
        formatted.text = `p95 ${numberText(value.p95_s, 3)} s · target < ${numberText(value.target_s, 0)} s`;
        formatted.detail = `${value.count} workflow runs`;
        formatted.status = value.pass ? "good" : "bad";
      } else if (tile.id === "load-errors") {
        formatted.text = `errors ${percentText(value.error_rate)} · 429 ${percentText(value.rate_429)}`;
        formatted.detail = `degraded ${percentText(value.degraded_rate)} · `
          + `status ${JSON.stringify(value.status_codes || {})} · `
          + `error target ≤ ${percentText(value.error_rate_limit)}`;
        formatted.status = value.error_rate_pass === false || Number(value.error_rate) > 0
          ? "bad" : "good";
      } else if (tile.id === "load-replicas") {
        formatted.text = `${value.observed}/${value.configured} replicas observed`;
        formatted.detail = (value.ids || []).join(", ");
      } else if (tile.id === "red-flag-recall") {
        formatted.text = percentText(value);
        formatted.status = Number(value) === 1 ? "good" : "bad";
      } else if (tile.id === "scope-leaks") {
        formatted.text = String(value);
        formatted.status = Number(value) === 0 ? "good" : "bad";
      } else if (tile.id === "ingest-queue") {
        formatted.text = `${value.depth} queued`;
        if (value.oldest_queued_age_seconds !== null)
          formatted.text += `; oldest ${numberText(value.oldest_queued_age_seconds)} s`;
      } else if (tile.id === "review-queue") {
        const open = Number(value.open) || 0;
        formatted.text = open === 0 ? "None waiting"
          : `${open} waiting · oldest ${numberText(value.oldest_age_minutes)} min · `
            + `${value.over_sla} over ${numberText(value.sla_minutes)} min SLA`;
      } else if (tile.id === "triage-p95" || tile.id === "record-p95") {
        const target = tile.id === "triage-p95" ? 4 : 8;
        const seconds = Number(value.p95_ms) / 1000;
        formatted.text = `p95 ${numberText(seconds)} s (n = ${value.count}, last 24 h)`;
        formatted.detail = `Target: ≤ ${target} s`;
        formatted.status = seconds <= target ? "good" : "bad";
      } else if (tile.id === "cost-per-run") {
        const amount = Number(value.average);
        const cost = Number.isFinite(amount)
          ? amount.toFixed(8).replace(/0+$/, "").replace(/\.$/, "") : String(value.average);
        formatted.text = `$${cost} per triage turn · price date: ${value.price_date}`;
      } else if (tile.id === "degraded-rate") {
        formatted.text = percentText(value);
      } else if (tile.id === "pick-slot-wait") {
        formatted.text = `p95 ${numberText(Number(value.p95_ms) / 1000)} s (n = ${value.count})`;
      } else if (tile.id === "scribe-review-time") {
        formatted.text = `median ${numberText(value.median_s, 2)} s · p95 ${numberText(value.p95_s, 2)} s `
          + `(n = ${value.count})`;
        formatted.detail = `Target: < 90 s · measured per signed note`;
        formatted.status = Number(value.p95_s) < Number(value.target_s) ? "good" : "bad";
      } else if (tile.id === "scribe-edit-distance") {
        formatted.text = `median ${numberText(value.median_characters, 0)} characters · p95 `
          + `${numberText(value.p95_characters, 0)} characters (n = ${value.count})`;
      } else if (value && typeof value === "object") {
        formatted.text = Object.entries(value)
          .map(([key, item]) => `${key.replaceAll("_", " ")}: ${String(item)}`).join(" · ");
      }
      return formatted;
    }

    function formatDuration(durationMs) {
      const duration = Number(durationMs);
      if (!Number.isFinite(duration)) return "duration unavailable";
      return duration >= 1000 ? `${numberText(duration / 1000, 2)} s` : `${numberText(duration)} ms`;
    }

    function appendTraceNodes(parent, spans) {
      const list = document.createElement("ul");
      for (const span of spans) {
        const item = document.createElement("li");
        item.textContent = `${span.kind}: ${span.name} · ${formatDuration(span.duration_ms)}`;
        if (span.children && span.children.length) appendTraceNodes(item, span.children);
        list.append(item);
      }
      parent.append(list);
    }

    function friendly(status) {
      if (status === 401) return "Please choose a sign-in persona above.";
      if (status === 403) return "This identity cannot view operations data. Pick the ops persona.";
      return "Operations data is not available right now. Please try again.";
    }

    function chip(text, kind) {
      const span = document.createElement("span");
      span.className = `chip ${kind}`;
      span.textContent = text;
      return span;
    }

    function loadRow(tile) {
      const value = tile.value;
      const row = document.createElement("tr");
      for (const text of [tile.label, `${numberText(value.p95_ms)} ms`, `< ${numberText(value.target_ms)} ms`,
        String(value.count), numberText(value.rps, 4)]) {
        const td = document.createElement("td");
        td.textContent = text;
        row.append(td);
      }
      const result = document.createElement("td");
      result.append(chip(value.pass ? "Pass" : "Fail", value.pass ? "good" : "bad"));
      row.append(result);
      for (const text of [
        JSON.stringify(value.status_codes || {}),
        value.first_error_body || "—",
      ]) {
        const td = document.createElement("td");
        td.textContent = text;
        row.append(td);
      }
      return row;
    }

    async function loadSummary() {
      tiles.replaceChildren();
      document.getElementById("tiles-note").textContent = "Loading metrics…";
      const loadBody = document.querySelector("#load-table tbody");
      loadBody.replaceChildren();
      document.getElementById("load-table-card").hidden = true;
      const response = await fetch("/ops/api/summary", { headers: headers() });
      if (!response.ok) throw new Error(friendly(response.status));
      const data = await response.json();
      document.getElementById("tiles-note").textContent = "";
      let shown = 0;
      for (const tile of data.tiles) {
        if (!tile.source) continue;
        if (tile.id.startsWith("load-endpoint-")) {
          loadBody.append(loadRow(tile));
          document.getElementById("load-table-card").hidden = false;
          continue;
        }
        shown += 1;
        const card = document.createElement("article");
        card.className = "tile";
        const title = document.createElement("h2");
        title.textContent = tile.label;
        const value = document.createElement("div");
        value.className = "value";
        const formatted = formatTile(tile);
        value.textContent = formatted.text;
        if (formatted.status) value.classList.add(formatted.status);
        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent = formatted.detail;
        const source = document.createElement("div");
        source.className = "source";
        source.textContent = `Source: ${tile.source}`;
        const statusChip = formatted.status === "good" ? chip("On target", "good")
          : formatted.status === "bad" ? chip("Needs attention", "bad")
          : tile.id === "degraded-rate" ? chip("Degraded share", "degraded") : chip("Info", "neutral");
        card.append(title, statusChip, value);
        if (formatted.detail) card.append(detail);
        card.append(source);
        tiles.append(card);
        if (tile.id === "latest-load-test") {
          document.getElementById("load-summary").textContent = `${formatted.text}. ${formatted.detail}`;
          document.getElementById("load-table-card").hidden = false;
        }
      }
      if (!shown) document.getElementById("tiles-note").textContent = "No sourced metrics yet. Run the evals or a load test to populate this page.";
    }

    const personas = [["Ops operator", "operator1"], ["Compliance reviewer", "compliance1"]];
    function markPersona() {
      for (const b of document.querySelectorAll("#persona-list button")) {
        b.setAttribute("aria-pressed", String(b.dataset.id === opsInput.value.trim()));
      }
    }
    for (const [label, id] of personas) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "secondary";
      b.textContent = label;
      b.dataset.id = id;
      b.setAttribute("aria-pressed", "false");
      b.onclick = () => { opsInput.value = id; document.getElementById("ops-auth-form").requestSubmit(); };
      document.getElementById("persona-list").append(b);
    }

    document.getElementById("ops-auth-form").addEventListener("submit", async event => {
      event.preventDefault();
      sessionStorage.setItem(tokenKey, `${tokenPrefix}${opsInput.value.trim()}`);
      markPersona();
      try { await loadSummary(); }
      catch (error) {
        tiles.replaceChildren();
        document.getElementById("tiles-note").textContent = error instanceof TypeError
          ? "We could not reach the server. Please try again in a moment." : error.message;
      }
    });

    document.getElementById("trace-form").addEventListener("submit", async event => {
      event.preventDefault();
      const id = document.getElementById("trace-id").value.trim();
      traceOutput.hidden = false;
      traceOutput.replaceChildren();
      try {
        const response = await fetch(`/ops/api/traces/${encodeURIComponent(id)}`, { headers: headers() });
        if (!response.ok) {
          traceOutput.textContent = response.status === 404
            ? "No trace found with that ID. Check it and try again."
            : friendly(response.status);
          return;
        }
        const tree = await response.json();
        appendTraceNodes(traceOutput, tree.spans);
      } catch (error) {
        traceOutput.textContent = "We could not reach the server. Please try again in a moment.";
      }
    });

    markPersona();
    if (savedToken) document.getElementById("ops-auth-form").requestSubmit();
    else document.getElementById("tiles-note").textContent = "Choose a sign-in persona above to load the sourced metrics.";
  </script>
</body>
</html>
