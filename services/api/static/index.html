<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahyog Care Companion</title>
<link rel="stylesheet" href="/static/sahyog.css">
</head>
<body>
<header class="site-header"><div class="inner"><div class="brand">Sahyog Care Companion <span class="demo-badge">Demo · synthetic data</span></div>
<nav class="site-nav" aria-label="Main"><a href="/" aria-current="page">Patient</a><a href="/frontdesk">Front desk</a><a href="/scribe">Doctor</a><a href="/ops">Ops</a></nav></div></header>
<div class="page">
<div class="persona-bar"><span class="label">Sign in as</span><div class="persona-list" id="persona-list"></div>
<details><summary>Other identity</summary><div class="other"><label>Signed in as <input id="identity" value="PT-W2-0001" aria-label="Demo bearer identity"></label><p class="muted">Caregiver demo identity: caregiver-&lt;caregiver_id&gt;-for-&lt;patient_id&gt; (W2 only).</p></div></details></div>
<main class="grid-2">
<section class="card"><h2>Find my doctor</h2><form id="triage"><label>Symptoms<textarea id="symptoms" required placeholder="Describe how you feel"></textarea></label><label>Age (optional)<input id="age" type="number" min="0" max="130"></label><button>Find care</button></form><div id="w1chips" aria-live="polite"></div><div id="w1" class="output" aria-live="polite"></div><div id="choices"></div></section>
<section class="card"><h2>My records</h2><form id="upload"><label>Upload a report<input id="report" type="file" accept="application/pdf" required></label><button>Upload a report</button></form><div id="documents" aria-live="polite"></div><form id="ask"><label>Question<textarea id="question" required placeholder="What is my haemoglobin?"></textarea></label><button>Ask about records</button></form><div id="w2chips" aria-live="polite"></div><div id="w2" class="output" aria-live="polite"></div></section>
</main>
<p><button id="access" class="secondary">Who saw my records</button></p><div id="audit" class="card" hidden aria-live="polite"></div>
</div>
<script>
let thread=null, owner=null, lastDegraded=false;
const $=id=>document.getElementById(id);
async function api(path,body){const key=body&&path.startsWith('/w1/')?crypto.randomUUID():null;const options={method:body?'POST':'GET',headers:{Authorization:'Bearer demo-'+$('identity').value.trim(),...(body?{'Content-Type':'application/json'}:{}),...(key?{'Idempotency-Key':key}:{})},...(body?{body:JSON.stringify(body)}:{})};const response=await fetch(path,options);lastDegraded=response.headers.get('X-Degraded')==='true';const data=await response.json();if(!response.ok){const e=Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));e.thread_id=data.thread_id||response.headers.get('X-Thread-Id');throw e;}return data;}
async function pollW1(id,patient){const deadline=Date.now()+30000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,2000));if(patient!==$('identity').value)return null;try{const data=await api('/w1/'+encodeURIComponent(id));if(data.status!=='running')return data;}catch(e){if(Date.now()+2000>=deadline)throw e;}}throw Error('Still working. Please check again shortly.');}
const languages={en:'English',hi:'Hindi',te:'Telugu',ta:'Tamil',kn:'Kannada',mr:'Marathi',bn:'Bengali',ur:'Urdu'};
const slotDate=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',weekday:'short',day:'numeric',month:'short'});
const slotTime=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true});
function formatSlotTime(value){const date=new Date(value);return slotDate.format(date).replace(',','')+', '+slotTime.format(date)+' IST';}
function friendly(e){const m=String((e&&e.message)||'');if(/authentication required/i.test(m))return 'Please choose who you are signing in as, using the buttons at the top.';if(/failed to fetch|networkerror/i.test(m))return 'We could not reach the server. Please try again in a moment.';if(!m||/^[\[{]/.test(m)||/unexpected token|json/i.test(m))return 'Something went wrong. Please try again.';return m;}
function chip(text,kind){const s=document.createElement('span');s.className='chip '+kind;s.textContent=text;return s;}
function setChips(id,list){const box=$(id);box.replaceChildren();for(const [t,k] of list)box.append(chip(t,k));}
function error(target,e){$(target).classList.add('danger');$(target).textContent=friendly(e);if(target==='w1')setChips('w1chips',[]);if(target==='w2')setChips('w2chips',[]);if(target==='w1'){$('choices').replaceChildren();}}
function renderW1(data){if(data.thread_id)thread=data.thread_id;const out=$('w1');out.className='output'+(data.red_flags?.length?' danger':'');out.textContent=data.reply||'';setChips('w1chips',[...(data.red_flags?.length?[['Emergency — go to desk','emergency']]:[]),...(data.booking_id?[['Booked','booked']]:[]),...(lastDegraded?[['Degraded','degraded']]:[])]);$('choices').replaceChildren();const pause=data.interrupt;if(!pause){if(data.booking_id)out.textContent+='\nBooking confirmed: '+data.booking_id;return;}
if(pause.type==='clarify'){out.textContent=pause.question;const form=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');input.required=true;input.setAttribute('aria-label','Clarification answer');button.textContent='Continue';form.append(input,button);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{renderW1(await api('/w1/'+encodeURIComponent(thread)+'/resume',{value:input.value}));}catch(e){error('w1',e);}};$('choices').append(form);}
else{const specialty=pause.specialty||data.specialty;if(specialty)out.textContent+='\nMatched specialty: '+specialty;out.textContent+='\nChoose an appointment:';for(const slot of pause.options){const button=document.createElement('button');button.textContent=slot.doctor_name+' · '+slot.clinic+' · '+formatSlotTime(slot.starts_at)+' · '+slot.languages.map(code=>languages[code]||code).join(', ');button.onclick=async()=>{for(const b of $('choices').querySelectorAll('button'))b.disabled=true;try{renderW1(await api('/w1/'+encodeURIComponent(thread)+'/resume',{value:slot.slot_id}));}catch(e){error('w1',e);}};$('choices').append(button);}}}
$('identity').oninput=()=>{clearTimeout(documentTimer);const caregiver=$('identity').value.trim().startsWith('caregiver-');$('triage').closest('section').hidden=caregiver;$('upload').hidden=caregiver;$('documents').hidden=caregiver;$('access').hidden=caregiver;$('documents').replaceChildren();if(!caregiver)loadDocuments();thread=null;owner=null;$('w1').textContent='';$('choices').replaceChildren();$('w2').textContent='';$('audit').hidden=true;};
$('triage').onsubmit=async e=>{e.preventDefault();const button=$('triage').querySelector('button');if(button.disabled)return;button.disabled=true;const patient=$('identity').value;owner=patient;$('choices').replaceChildren();$('w1').className='output';$('w1').textContent='Working… (this can take up to 15 s)';let id=null;try{let data;try{data=await api('/w1/triage',{text:$('symptoms').value,...($('age').value?{age:Number($('age').value)}:{})});id=data.thread_id;if(id&&patient===$('identity').value)thread=id;}catch(e){id=e.thread_id;if(!id)throw e;if(patient===$('identity').value)thread=id;data={status:'running'};}if(data.status==='running'&&id)data=await pollW1(id,patient);if(data&&patient===$('identity').value)renderW1(data);}catch(e){if(patient===$('identity').value)error('w1',e);}finally{button.disabled=false;}};
$('ask').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;const patient=$('identity').value;$('w2').className='output';$('w2').textContent='Looking through your records…';setChips('w2chips',[]);try{const data=await api('/w2/ask',{question:$('question').value});if(patient===$('identity').value){$('w2').className='output';$('w2').textContent=data.reply;const cites=[...String(data.reply||'').matchAll(/([A-Za-z0-9][\w .-]{1,60}?),?\s+p\.\s*(\d+)/g)].slice(0,4).map(m=>['Cited: '+m[1].trim()+' p.'+m[2],'cited']);setChips('w2chips',[...cites,...(lastDegraded?[['Degraded','degraded']]:[])]);}}catch(e){error('w2',e);}finally{e.submitter.disabled=false;}};
$('access').onclick=async()=>{const patient=$('identity').value;try{const rows=await api('/records/access-log');if(patient!==$('identity').value)return;const area=$('audit');area.hidden=false;area.classList.remove('danger');area.replaceChildren();if(!rows.length){area.textContent='No recorded access.';return;}const table=document.createElement('table'),head=document.createElement('tr');for(const key of ['at','actor_id','purpose','resource_type','resource_id']){const th=document.createElement('th');th.textContent=key.replaceAll('_',' ');head.append(th);}table.append(head);for(const row of rows){const tr=document.createElement('tr');for(const key of ['at','actor_id','purpose','resource_type','resource_id']){const td=document.createElement('td');td.textContent=(key==='at'?row.at_display:row[key])||'—';tr.append(td);}table.append(tr);}area.append(table);}catch(e){$('audit').hidden=false;error('audit',e);}};
let documentTimer;
async function loadDocuments(){clearTimeout(documentTimer);if($('identity').value.trim().startsWith('caregiver-'))return;const patient=$('identity').value;try{const rows=await api('/records/documents');if(patient!==$('identity').value)return;$('documents').replaceChildren();if(!rows.length){const p=document.createElement('p');p.className='empty-state';p.textContent='No reports yet. Upload a PDF report to get started.';$('documents').append(p);}for(const row of rows){const p=document.createElement('p');p.textContent=[row.title,row.ingest_status,row.error,row.uploaded_at_display].filter(Boolean).join(' · ');$('documents').append(p);}if(rows.some(r=>['queued','parsing'].includes(r.ingest_status)))documentTimer=setTimeout(loadDocuments,2000);}catch(e){error('documents',e);}}
async function pollJob(id,patient){if(patient!==$('identity').value)return;try{const job=await api('/records/api/jobs/'+encodeURIComponent(id));await loadDocuments();if(['queued','running'].includes(job.status))setTimeout(()=>pollJob(id,patient),2000);}catch(e){error('documents',e);}}
$('upload').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const patient=$('identity').value;const form=new FormData();form.append('file',$('report').files[0]);try{const r=await fetch('/records/upload',{method:'POST',headers:{Authorization:'Bearer demo-'+patient.trim(),'Idempotency-Key':crypto.randomUUID()},body:form});const d=await r.json();if(!r.ok)throw Error(d.detail);if(patient===$('identity').value){await loadDocuments();pollJob(d.job_id,patient);}}catch(e){error('documents',e);}finally{button.disabled=false;}};

const personas=[['Priya · patient','PT-W2-0001'],['Demo patient','PT-DEMO-0001'],['Priya as caregiver for PT-W2-0002','caregiver-PT-W2-0001-for-PT-W2-0002']];
const personaKey='sahyogPersona';
function markPersona(){const v=$('identity').value.trim();for(const b of document.querySelectorAll('#persona-list button'))b.setAttribute('aria-pressed',String(b.dataset.id===v));}
function pickPersona(id){$('identity').value=id;try{sessionStorage.setItem(personaKey,id);}catch(e){}markPersona();$('identity').oninput();}
for(const [label,id] of personas){const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.dataset.id=id;b.setAttribute('aria-pressed','false');b.onclick=()=>pickPersona(id);$('persona-list').append(b);}
$('identity').addEventListener('input',()=>{try{sessionStorage.setItem(personaKey,$('identity').value);}catch(e){}markPersona();});
let remembered=null;try{remembered=sessionStorage.getItem(personaKey);}catch(e){}
if(remembered&&remembered!==$('identity').value){pickPersona(remembered);}else{markPersona();loadDocuments();}
</script>
</body>
</html>
