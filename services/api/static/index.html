<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahyog Care Companion</title>
<style>
body{font:16px system-ui;margin:24px auto;padding:0 24px;max-width:1180px;background:#f1f6f5;color:#183b38}h1{margin:0 0 8px}h2{margin-top:0}header{margin-bottom:20px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;padding:22px;border-radius:12px;border:1px solid #cbded9}label{display:block;margin:10px 0}input,textarea,button{font:inherit;box-sizing:border-box}input,textarea{padding:9px;border:1px solid #93afa9;border-radius:5px;width:100%}textarea{height:85px;resize:vertical}button{background:#14645a;color:white;padding:10px 15px;border:0;border-radius:6px;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.5}#identity{width:220px;display:inline-block}.output{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.danger{background:#fff0ef;color:#8c1919;border:2px solid #c33;padding:14px}.muted{color:#526a66;font-size:14px}#audit{background:white;border-radius:8px;padding:12px;max-height:240px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:7px;border-bottom:1px solid #dce5e3}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>Sahyog Care Companion</h1><span class="muted">Core demo · synthetic patients only</span>
<label>Signed in as <input id="identity" value="PT-W2-0001" aria-label="Signed in as patient ID"></label></header>
<p><a href="/?view=frontdesk">Front desk</a></p>
<main>
<section><h2>Find my doctor</h2><form id="triage"><label>Symptoms<textarea id="symptoms" required placeholder="Describe how you feel"></textarea></label><label>Age (optional)<input id="age" type="number" min="0" max="130"></label><button>Find care</button></form><div id="w1" class="output" aria-live="polite"></div><div id="choices"></div></section>
<section><h2>My records</h2><form id="upload"><label>Upload a report<input id="report" type="file" accept="application/pdf" required></label><button>Upload a report</button></form><div id="documents" aria-live="polite"></div><form id="ask"><label>Question<textarea id="question" required placeholder="What is my haemoglobin?"></textarea></label><label>For patient (optional; requires consent)<input id="subject" placeholder="Leave blank for your own records"></label><button>Ask about records</button></form><div id="w2" class="output" aria-live="polite"></div></section>
</main>
<button id="access">Who saw my records</button><div id="audit" hidden aria-live="polite"></div>
<script>
let thread=null, owner=null;
const $=id=>document.getElementById(id);
async function api(path,body){const key=body&&path.startsWith('/w1/')?crypto.randomUUID():null;const options={method:body?'POST':'GET',headers:{Authorization:'Bearer demo-'+$('identity').value.trim(),...(body?{'Content-Type':'application/json'}:{}),...(key?{'Idempotency-Key':key}:{})},...(body?{body:JSON.stringify(body)}:{})};const response=await fetch(path,options);const data=await response.json();if(!response.ok){const e=Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));e.thread_id=data.thread_id||response.headers.get('X-Thread-Id');throw e;}return data;}
async function pollW1(id,patient){const deadline=Date.now()+30000;while(Date.now()<deadline){await new Promise(resolve=>setTimeout(resolve,2000));if(patient!==$('identity').value)return null;try{const data=await api('/w1/'+encodeURIComponent(id));if(data.status!=='running')return data;}catch(e){if(Date.now()+2000>=deadline)throw e;}}throw Error('Still working. Please check again shortly.');}
const languages={en:'English',hi:'Hindi',te:'Telugu',ta:'Tamil',kn:'Kannada',mr:'Marathi',bn:'Bengali',ur:'Urdu'};
const slotDate=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',weekday:'short',day:'numeric',month:'short'});
const slotTime=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',hour12:true});
function formatSlotTime(value){const date=new Date(value);return slotDate.format(date).replace(',','')+', '+slotTime.format(date)+' IST';}
function error(target,e){$(target).classList.add('danger');$(target).textContent=e.message;if(target==='w1'){$('choices').replaceChildren();}}
function renderW1(data){if(data.thread_id)thread=data.thread_id;const out=$('w1');out.className='output'+(data.red_flags?.length?' danger':'');out.textContent=data.reply||'';$('choices').replaceChildren();const pause=data.interrupt;if(!pause){if(data.booking_id)out.textContent+='\nBooking confirmed: '+data.booking_id;return;}
if(pause.type==='clarify'){out.textContent=pause.question;const form=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');input.required=true;input.setAttribute('aria-label','Clarification answer');button.textContent='Continue';form.append(input,button);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{renderW1(await api('/w1/'+encodeURIComponent(thread)+'/resume',{value:input.value}));}catch(e){error('w1',e);}};$('choices').append(form);}
else{const specialty=pause.specialty||data.specialty;if(specialty)out.textContent+='\nMatched specialty: '+specialty;out.textContent+='\nChoose an appointment:';for(const slot of pause.options){const button=document.createElement('button');button.textContent=slot.doctor_name+' · '+slot.clinic+' · '+formatSlotTime(slot.starts_at)+' · '+slot.languages.map(code=>languages[code]||code).join(', ');button.onclick=async()=>{for(const b of $('choices').querySelectorAll('button'))b.disabled=true;try{renderW1(await api('/w1/'+encodeURIComponent(thread)+'/resume',{value:slot.slot_id}));}catch(e){error('w1',e);}};$('choices').append(button);}}}
$('identity').oninput=()=>{clearTimeout(documentTimer);$('documents').replaceChildren();loadDocuments();thread=null;owner=null;$('w1').textContent='';$('choices').replaceChildren();$('w2').textContent='';$('audit').hidden=true;};
$('triage').onsubmit=async e=>{e.preventDefault();const button=$('triage').querySelector('button');if(button.disabled)return;button.disabled=true;const patient=$('identity').value;owner=patient;$('choices').replaceChildren();$('w1').className='output';$('w1').textContent='Working… (this can take up to 15 s)';let id=null;try{let data;try{data=await api('/w1/triage',{text:$('symptoms').value,...($('age').value?{age:Number($('age').value)}:{})});id=data.thread_id;if(id&&patient===$('identity').value)thread=id;}catch(e){id=e.thread_id;if(!id)throw e;if(patient===$('identity').value)thread=id;data={status:'running'};}if(data.status==='running'&&id)data=await pollW1(id,patient);if(data&&patient===$('identity').value)renderW1(data);}catch(e){if(patient===$('identity').value)error('w1',e);}finally{button.disabled=false;}};
$('ask').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;const patient=$('identity').value;try{const data=await api('/w2/ask',{question:$('question').value,...($('subject').value.trim()?{subject_id:$('subject').value.trim()}:{})});if(patient===$('identity').value){$('w2').className='output';$('w2').textContent=data.reply;}}catch(e){error('w2',e);}finally{e.submitter.disabled=false;}};
$('access').onclick=async()=>{const patient=$('identity').value;try{const rows=await api('/records/access-log');if(patient!==$('identity').value)return;const area=$('audit');area.hidden=false;area.classList.remove('danger');area.replaceChildren();if(!rows.length){area.textContent='No recorded access.';return;}const table=document.createElement('table'),head=document.createElement('tr');for(const key of ['at','actor_id','purpose','resource_type','resource_id']){const th=document.createElement('th');th.textContent=key.replaceAll('_',' ');head.append(th);}table.append(head);for(const row of rows){const tr=document.createElement('tr');for(const key of ['at','actor_id','purpose','resource_type','resource_id']){const td=document.createElement('td');td.textContent=(key==='at'?row.at_display:row[key])||'—';tr.append(td);}table.append(tr);}area.append(table);}catch(e){$('audit').hidden=false;error('audit',e);}};
let documentTimer;
async function loadDocuments(){clearTimeout(documentTimer);const patient=$('identity').value;try{const rows=await api('/records/documents');if(patient!==$('identity').value)return;$('documents').replaceChildren();for(const row of rows){const p=document.createElement('p');p.textContent=[row.title,row.ingest_status,row.error,row.uploaded_at_display].filter(Boolean).join(' · ');$('documents').append(p);}if(rows.some(r=>['queued','parsing'].includes(r.ingest_status)))documentTimer=setTimeout(loadDocuments,2000);}catch(e){error('documents',e);}}
async function pollJob(id,patient){if(patient!==$('identity').value)return;try{const job=await api('/records/api/jobs/'+encodeURIComponent(id));await loadDocuments();if(['queued','running'].includes(job.status))setTimeout(()=>pollJob(id,patient),2000);}catch(e){error('documents',e);}}
$('upload').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;const patient=$('identity').value;const form=new FormData();form.append('file',$('report').files[0]);try{const r=await fetch('/records/upload',{method:'POST',headers:{Authorization:'Bearer demo-'+patient.trim(),'Idempotency-Key':crypto.randomUUID()},body:form});const d=await r.json();if(!r.ok)throw Error(d.detail);if(patient===$('identity').value){await loadDocuments();pollJob(d.job_id,patient);}}catch(e){error('documents',e);}finally{button.disabled=false;}};
loadDocuments();
</script>
</body>
</html>
