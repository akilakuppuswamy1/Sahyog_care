<!doctype html><html lang="en"><meta charset="utf-8"><title>Sahyog Front desk</title>
<style>body{font:16px system-ui;max-width:1100px;margin:30px auto;color:#183b38}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #ccc}button,input{font:inherit;padding:8px;margin:5px}</style>
<h1>Front desk</h1><label>Staff ID <input id="staff" value="FD01"></label><button id="refresh">Refresh</button><p id="error" role="alert"></p>
<h2>Escalation queue</h2><table id="queue"></table><h2>Bookings</h2><label>Booked by <select id="by"><option>assistant</option><option>front_desk</option><option>patient</option></select></label><table id="bookings"></table>
<script>
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer demo-staff-'+$('staff').value.trim(),...(body?{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.detail);return d;}
function cell(tr,text){const td=document.createElement('td');td.textContent=text??'';tr.append(td);return td;}
async function refresh(){try{$('error').textContent='';const q=await api('/frontdesk/escalations?status=open');$('queue').replaceChildren();for(const e of q){const tr=document.createElement('tr');for(const v of [e.patient_id,e.purpose,e.at_display,JSON.stringify(e.detail)])cell(tr,v);const b=document.createElement('button');b.textContent='Handled';b.onclick=()=>act('/frontdesk/escalations/'+e.id+'/handled',{});cell(tr,'').append(b);$('queue').append(tr);}const bs=await api('/frontdesk/bookings?booked_by='+$('by').value);$('bookings').replaceChildren();for(const a of bs){const tr=document.createElement('tr');for(const v of [a.patient_id,a.doctor||a.doctor_name,a.clinic,a.starts_at_display,a.status])cell(tr,v);if(a.status==='booked'){const td=cell(tr,'');const cancel=document.createElement('button');cancel.textContent='Cancel';cancel.onclick=()=>act('/frontdesk/bookings/'+a.appt_id+'/cancel',{});const slot=document.createElement('input');slot.placeholder='New slot ID';slot.setAttribute('aria-label','New slot ID');const move=document.createElement('button');move.textContent='Move';move.onclick=()=>{if(slot.value.trim())act('/frontdesk/bookings/'+a.appt_id+'/move',{slot_id:slot.value.trim()});};td.append(cancel,slot,move);}$('bookings').append(tr);}}catch(e){$('error').textContent=e.message;}}
let acting=false;
async function act(path,body){if(acting)return;acting=true;const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);$('error').textContent='Working… (this can take up to 15 s)';try{await api(path,body);await refresh();}catch(e){$('error').textContent=e.message;}finally{acting=false;buttons.forEach(b=>b.disabled=false);}}
$('refresh').onclick=refresh;$('by').onchange=refresh;
</script></html>
